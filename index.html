<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>汇集量化影子验证</title>
  <link rel="stylesheet" href="./assets/styles.css?v=20260810-1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>汇集量化影子验证</h1>
      <p class="updated"><span id="updated">正在读取数据…</span><span id="dataSourceStatus" aria-live="polite"></span></p>
    </div>
    <label class="month-picker">
      <select id="month" aria-label="统计月份"></select>
    </label>
  </header>

  <main>
    <section id="status" class="status-card" aria-live="polite"></section>

    <details class="panel overview-panel">
      <summary class="panel-head overview-summary">
        <div><h2>收益概览</h2></div>
        <span class="overview-summary-meta">
          <span class="muted">仅计已结算收益 · 待结算不计入当前收益</span>
          <span class="ledger-toggle overview-toggle" aria-hidden="true"></span>
        </span>
      </summary>
      <p id="overviewScope" class="overview-scope"></p>
      <div id="rankCards" class="rank-cards"></div>
      <div class="chart-head">
        <span id="chartTitle">TOP1 / TOP2 / TOP3收益对比</span>
        <span class="chart-meta">
          <span id="chartNote"></span>
          <span id="chartLegend" class="chart-legend"><i class="dot rank-one"></i>TOP1 <i class="dot rank-two"></i>TOP2 <i class="dot rank-three"></i>TOP3</span>
        </span>
      </div>
      <div id="chart" class="chart" role="img" aria-label="TOP1、TOP2、TOP3的收益统计"></div>
    </details>

    <section class="panel">
      <div class="panel-head">
        <div><h2>汇集排序</h2></div>
      </div>
      <div
        id="candidates"
        class="table-wrap"
        tabindex="0"
        role="region"
        aria-label="汇集排序表，可横向滑动查看全部字段"
      ></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div><h2>单日收益与执行状态</h2></div>
        <span class="muted">按信号批次展开查看全部候选</span>
      </div>
      <div id="daily" class="daily-ledger"></div>
    </section>
  </main>

  <footer>影子研究系统，不连接券商、不发送订单、不构成投资建议。影子成交统一按T日未复权开盘价计算。</footer>
  <script src="./assets/app.js?v=20260810-1" defer></script>
</body>
</html>
