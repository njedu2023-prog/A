name: Three-table daily shadow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the 21:30 output batch or the 19:00 validation batch"
        required: true
        default: output
        type: choice
        options:
          - output
          - validation
      force:
        description: "Force this manual batch even when today's batch is already complete"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-shadow.yml"
      - ".nojekyll"
      - "index.html"
      - "assets/**"
      - "config/**"
      - "data/execution_truth.v1.json"
      - "data/security_master.v1.json"
      - "data/trading_calendar_*.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    # Redundant wake-ups avoid depending on one delayed top-of-hour cron. The
    # automation gate and the serialized state job make the attempts idempotent.
    - cron: "40 10 * * 1-5"  # 18:40 Asia/Shanghai: validation pre-wake
    - cron: "55 10 * * 1-5"  # 18:55 Asia/Shanghai: validation pre-wake
    - cron: "10 11 * * 1-5"  # 19:10 Asia/Shanghai: validation recovery wake
    - cron: "10 13 * * 1-5"  # 21:10 Asia/Shanghai: output pre-wake
    - cron: "25 13 * * 1-5"  # 21:25 Asia/Shanghai: output pre-wake
    - cron: "40 13 * * 1-5"  # 21:40 Asia/Shanghai: output recovery wake

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    # Only state readers/writers serialize. Pages deployment is a separate job
    # and must never retain this lock after state has been published.
    concurrency:
      group: three-table-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      should_deploy: ${{ steps.publish-policy.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Capture checked-out parent
        id: checkout-parent
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify Pages uses the controlled Actions source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_pages_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Classify batch mode
        id: batch-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "mode=push" >> "$GITHUB_OUTPUT"
            echo "not_before=" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
            if [[ "$DISPATCH_MODE" == "validation" ]]; then
              echo "not_before=19:00" >> "$GITHUB_OUTPUT"
            else
              echo "not_before=21:30" >> "$GITHUB_OUTPUT"
            fi
          else
            case "$SCHEDULE_CRON" in
              "40 10 * * 1-5"|"55 10 * * 1-5"|"10 11 * * 1-5")
                echo "mode=validation" >> "$GITHUB_OUTPUT"
                echo "not_before=19:00" >> "$GITHUB_OUTPUT"
                ;;
              "10 13 * * 1-5"|"25 13 * * 1-5"|"40 13 * * 1-5")
                echo "mode=output" >> "$GITHUB_OUTPUT"
                echo "not_before=21:30" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported scheduled cron: $SCHEDULE_CRON" >&2
                exit 1
                ;;
            esac
          fi
      - name: Check the official A-share trading calendar
        id: market-day
        if: ${{ github.event_name != 'push' }}
        run: python -m three_table_quant.schedule_guard --config config/system.json >> "$GITHUB_OUTPUT"
      - name: Gate duplicate automated batch attempts
        id: automation-gate
        if: ${{ github.event_name != 'push' && steps.market-day.outputs.is_open == 'true' }}
        env:
          BATCH_MODE: ${{ steps.batch-mode.outputs.mode }}
          MARKET_DATE: ${{ steps.market-day.outputs.market_date }}
          FORCE_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          args=(
            python -m three_table_quant.automation_gate
            --mode "$BATCH_MODE"
            --dashboard data/dashboard.v1.json
            --market-date "$MARKET_DATE"
          )
          if [[ "$FORCE_BATCH" == "true" ]]; then
            args+=(--force)
          fi
          "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Contract tests
        if: ${{ github.event_name == 'push' || steps.automation-gate.outputs.should_run == 'true' }}
        run: python -m unittest discover -s tests -v
      - name: Wait until the exact batch time
        id: schedule-clock
        if: ${{ steps.automation-gate.outputs.should_run == 'true' }}
        run: >-
          python -m three_table_quant.schedule_clock
          --timezone Asia/Shanghai
          --market-date "${{ steps.market-day.outputs.market_date }}"
          --not-before "${{ steps.batch-mode.outputs.not_before }}"
          --max-wait-seconds 1500
          >> "$GITHUB_OUTPUT"
      - name: Resolve publication policy
        id: publish-policy
        env:
          SHOULD_DEPLOY: ${{ github.event_name == 'push' || steps.automation-gate.outputs.should_run == 'true' }}
        run: echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
      - name: Capture automated batch start
        id: batch-start
        if: ${{ steps.automation-gate.outputs.should_run == 'true' }}
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Validate due shadow records without loading the three sources
        if: ${{ steps.automation-gate.outputs.should_run == 'true' && steps.batch-mode.outputs.mode == 'validation' }}
        run: python -m three_table_quant.scheduled_validation --config config/system.json
      - name: Self-check validation result before publication
        if: ${{ steps.automation-gate.outputs.should_run == 'true' && steps.batch-mode.outputs.mode == 'validation' }}
        run: >-
          python -m three_table_quant.batch_result
          --mode validation
          --dashboard data/dashboard.v1.json
          --market-date "${{ steps.market-day.outputs.market_date }}"
          --started-at "${{ steps.batch-start.outputs.started_at }}"
      - name: Wait for aligned sources and run fail-closed output pipeline
        if: ${{ steps.automation-gate.outputs.should_run == 'true' && steps.batch-mode.outputs.mode == 'output' }}
        env:
          TARGET_DECISION_DATE: ${{ steps.market-day.outputs.market_date }}
        run: >-
          python -m three_table_quant.readiness
          --config config/system.json
          --attempts 25
          --interval-seconds 300
          --target-decision-date "$TARGET_DECISION_DATE"
      - name: Self-check output result before publication
        if: ${{ steps.automation-gate.outputs.should_run == 'true' && steps.batch-mode.outputs.mode == 'output' }}
        env:
          TARGET_DECISION_DATE: ${{ steps.market-day.outputs.market_date }}
        run: >-
          python -m three_table_quant.batch_result
          --mode output
          --dashboard data/dashboard.v1.json
          --target-decision-date "$TARGET_DECISION_DATE"
          --started-at "${{ steps.batch-start.outputs.started_at }}"
      - name: Publish generated data in one API commit
        if: ${{ github.event_name != 'push' && steps.automation-gate.outputs.should_run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/publish_outputs.py
          data/state.v1.json
          data/dashboard.v1.json
          data/source_issues.v1.json
          data/model_registry.v1.json
          --include-dir data/single_stock_minute_archive
          --branch main
          --expected-parent ${{ steps.checkout-parent.outputs.sha }}
      - name: Prepare Pages artifact
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp -R assets/. _site/assets/
          cp data/dashboard.v1.json data/source_issues.v1.json _site/data/
      - name: Configure GitHub Pages
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.should_deploy == 'true' }}
    # Serialize production deployments without killing an active one. Abruptly
    # cancelling deploy-pages can leave the backend deployment in progress.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
