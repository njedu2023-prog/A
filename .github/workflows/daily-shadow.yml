name: Three-table daily shadow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run the 21:30 output batch or the 19:00 validation batch"
        required: true
        default: output
        type: choice
        options:
          - output
          - validation
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-shadow.yml"
      - ".nojekyll"
      - "index.html"
      - "assets/**"
      - "config/**"
      - "data/execution_truth.v1.json"
      - "data/security_master.v1.json"
      - "data/trading_calendar_*.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    - cron: "0 11 * * 1-5"   # 19:00 Asia/Shanghai: validate T close and due T+1 exits
    - cron: "30 13 * * 1-5"  # 21:30 Asia/Shanghai: freeze aligned D signal

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: three-table-daily-shadow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      should_deploy: ${{ steps.publish-policy.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Capture checked-out parent
        id: checkout-parent
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify Pages uses the controlled Actions source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_pages_source.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Check the official A-share trading calendar
        id: market-day
        if: ${{ github.event_name != 'push' }}
        run: python -m three_table_quant.schedule_guard --config config/system.json >> "$GITHUB_OUTPUT"
      - name: Resolve publication policy
        id: publish-policy
        env:
          SHOULD_DEPLOY: ${{ github.event_name == 'push' || steps.market-day.outputs.is_open == 'true' }}
        run: echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
      - name: Capture automated batch start
        id: batch-start
        if: ${{ github.event_name != 'push' }}
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Validate due shadow records without loading the three sources
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5' && steps.market-day.outputs.is_open == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validation' && steps.market-day.outputs.is_open == 'true') }}
        run: python -m three_table_quant.scheduled_validation --config config/system.json
      - name: Self-check validation result before publication
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 1-5' && steps.market-day.outputs.is_open == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'validation' && steps.market-day.outputs.is_open == 'true') }}
        run: >-
          python -m three_table_quant.batch_result
          --mode validation
          --dashboard data/dashboard.v1.json
          --market-date "${{ steps.market-day.outputs.market_date }}"
          --started-at "${{ steps.batch-start.outputs.started_at }}"
      - name: Wait for aligned sources and run fail-closed output pipeline
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1-5' && steps.market-day.outputs.is_open == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'output' && steps.market-day.outputs.is_open == 'true') }}
        env:
          TARGET_DECISION_DATE: ${{ steps.market-day.outputs.market_date }}
        run: >-
          python -m three_table_quant.readiness
          --config config/system.json
          --attempts 25
          --interval-seconds 300
          --target-decision-date "$TARGET_DECISION_DATE"
      - name: Self-check output result before publication
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1-5' && steps.market-day.outputs.is_open == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'output' && steps.market-day.outputs.is_open == 'true') }}
        env:
          TARGET_DECISION_DATE: ${{ steps.market-day.outputs.market_date }}
        run: >-
          python -m three_table_quant.batch_result
          --mode output
          --dashboard data/dashboard.v1.json
          --target-decision-date "$TARGET_DECISION_DATE"
          --started-at "${{ steps.batch-start.outputs.started_at }}"
      - name: Publish generated data in one API commit
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' && github.event_name != 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/publish_outputs.py
          data/state.v1.json
          data/dashboard.v1.json
          data/source_issues.v1.json
          data/model_registry.v1.json
          --include-dir data/single_stock_minute_archive
          --branch main
          --expected-parent ${{ steps.checkout-parent.outputs.sha }}
      - name: Prepare Pages artifact
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp -R assets/. _site/assets/
          cp data/dashboard.v1.json data/source_issues.v1.json _site/data/
      - name: Configure GitHub Pages
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: ${{ steps.publish-policy.outputs.should_deploy == 'true' }}
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ needs.build.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
