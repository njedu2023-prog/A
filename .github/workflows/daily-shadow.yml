name: Three-table daily shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-shadow.yml"
      - ".nojekyll"
      - "index.html"
      - "assets/**"
      - "config/**"
      - "data/execution_truth.v1.json"
      - "data/trading_calendar_*.json"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    - cron: "30 13 * * 1-5"  # 21:30 Asia/Shanghai: freeze aligned D signal

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: three-table-daily-shadow
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Capture checked-out parent
        id: checkout-parent
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Run fail-closed shadow pipeline
        run: python -m three_table_quant.cli --config config/system.json
      - name: Publish generated data in one API commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/publish_outputs.py
          data/state.v1.json
          data/dashboard.v1.json
          data/source_issues.v1.json
          data/model_registry.v1.json
          --branch main
          --expected-parent ${{ steps.checkout-parent.outputs.sha }}
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/assets _site/data
          cp index.html .nojekyll _site/
          cp -R assets/. _site/assets/
          cp data/dashboard.v1.json data/source_issues.v1.json _site/data/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
