[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "three-table-quant"
version = "0.2.0"
description = "Formal three-table A-share ranking and T+1 shadow validation engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary research use"}
authors = [{name = "njedu2023-prog"}]
dependencies = [
  "certifi>=2025.1.31"
]

[project.scripts]
three-table-quant = "three_table_quant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
